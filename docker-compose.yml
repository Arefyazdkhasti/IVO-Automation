services:
  app:
    build: .
    container_name: ivo-automation
    ports:
      - "${PORT:-3002}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # headless در سرور پیش‌فرض است. برای Chromium headed داخل کانتینر (با Xvfb):
      # PLAYWRIGHT_USE_XVFB: "true"
      # PLAYWRIGHT_HEADLESS: "false"
      PLAYWRIGHT_HEADLESS: "true"
    volumes:
      - app-data:/app/data
      - app-results:/app/results
    shm_size: 1gb
    restart: unless-stopped

volumes:
  app-data:
  app-results:
